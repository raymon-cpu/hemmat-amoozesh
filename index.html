<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه آموزشی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --bg:#f1f5f9; --card:#fff; --text:#1e293b; --primary:#2563eb; --border:#e2e8f0; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { min-height:100vh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--text); font-family:"Vazirmatn",sans-serif; }
        button,a { font:inherit; -webkit-tap-highlight-color:transparent; }
        button { cursor:pointer; }
        .container { width:100%; max-width:800px; padding:2rem; text-align:center; }
        h1 { margin-bottom:.8rem; color:var(--primary); font-size:2rem; }
        .subtitle { margin-bottom:2rem; color:#64748b; }
        .options { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr)); gap:1rem; }
        .card { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:.6rem; min-height:140px; padding:1rem; border:2px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); text-decoration:none; font-weight:700; transition:transform .2s,border-color .2s; }
        .card:hover { transform:translateY(-3px); border-color:var(--primary); }
        .icon { font-size:2.4rem; line-height:1.3; }
        .schedule-section { margin-top:2rem; padding-top:1.5rem; border-top:2px dashed var(--border); }
        .schedule-card { width:100%; max-width:260px; margin:auto; border-color:#10b981; }
        dialog { margin:auto; width:calc(100% - 2rem); max-width:380px; max-height:92vh; padding:1.5rem; border:0; border-radius:8px; background:var(--card); color:var(--text); text-align:center; }
        dialog::backdrop { background:rgba(0,0,0,.75); }
        .dialog-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.2rem; }
        .dialog-header h2 { font-size:1.05rem; }
        .close { flex-shrink:0; width:36px; height:36px; border:0; border-radius:8px; background:#fee2e2; color:#b91c1c; font-size:1.5rem; }
        .class-buttons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.6rem; direction:ltr; }
        .class-buttons button { min-height:48px; border:0; border-radius:8px; background:var(--primary); color:white; font-size:1.1rem; font-weight:700; }
        #schedulePopup { width:fit-content; max-width:calc(100% - 2rem); padding:1rem; }
        .schedule-image { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; object-fit:contain; margin:auto; }
        #imageError { padding:1rem; color:#b91c1c; }
        :focus-visible { outline:3px solid #0891b2; outline-offset:3px; }
        @media(max-width:480px) { .container { padding:1rem 0; } h1 { font-size:1.6rem; } }
    </style>
</head>
<body>
    <main class="container">
        <h1>سامانه آموزشی ⚛️</h1>
        <p class="subtitle">لطفاً بخش مورد نظر را انتخاب کنید:</p>
        <div class="options">
            <a href="physics.html" class="card"><span class="icon" aria-hidden="true">⚛️</span><span>فیزیک</span></a>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">🧬</span><span>زیست</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">🧪</span><span>شیمی</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">📖</span><span>فارسی</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">🌐</span><span>عربی</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">💖</span><span>از من تا خدا</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">📿</span><span>قرآن</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">🌍</span><span>اجتماعی</span></button>
            <button type="button" class="card" data-soon><span class="icon" aria-hidden="true">📐</span><span>ریاضی</span></button>
        </div>
        <div class="schedule-section"><button type="button" class="card schedule-card" onclick="document.getElementById('classPicker').showModal()"><span class="icon" aria-hidden="true">🗓️</span><span>برنامه هفتگی</span></button></div>
    </main>
    <dialog id="soonPopup" aria-labelledby="soonTitle"><div class="dialog-header"><h2 id="soonTitle">به‌زودی اضافه می‌شود...</h2><button type="button" class="close" aria-label="بستن" onclick="this.closest('dialog').close()">×</button></div></dialog>
    <dialog id="classPicker" aria-labelledby="classTitle"><div class="dialog-header"><h2 id="classTitle">کلاس موردنظر را انتخاب کنید</h2><button type="button" class="close" aria-label="بستن" onclick="this.closest('dialog').close()">×</button></div><div class="class-buttons"><button type="button" onclick="showSchedule('801')">801</button><button type="button" onclick="showSchedule('802')">802</button><button type="button" onclick="showSchedule('803')">803</button></div></dialog>
    <dialog id="schedulePopup" aria-labelledby="scheduleTitle"><div class="dialog-header"><h2 id="scheduleTitle">برنامه هفتگی</h2><button type="button" class="close" aria-label="بستن" onclick="this.closest('dialog').close()">×</button></div><img id="scheduleImage" class="schedule-image" alt="برنامه هفتگی"><p id="imageError" hidden>تصویر برنامه در دسترس نیست.</p></dialog>
    <script>
        document.querySelectorAll("[data-soon]").forEach(button => button.addEventListener("click", () => document.getElementById("soonPopup").showModal()));
        document.querySelectorAll("dialog").forEach(dialog => dialog.addEventListener("click", event => { const box = dialog.getBoundingClientRect(); if (event.target === dialog && (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom)) dialog.close(); }));
        function showSchedule(classNumber) {
            if (!["801", "802", "803"].includes(classNumber)) return;
            const image = document.getElementById("scheduleImage"), error = document.getElementById("imageError");
            image.hidden = false; image.style.display = "block"; error.hidden = true;
            image.onerror = () => { image.style.display = "none"; error.hidden = false; };
            image.alt = `برنامه هفتگی کلاس ${classNumber}`; image.src = `barname-haftegi-${classNumber}.jpg`;
            document.getElementById("scheduleTitle").textContent = `برنامه هفتگی کلاس ${classNumber}`;
            document.getElementById("classPicker").close(); document.getElementById("schedulePopup").showModal();
        }
    </script>
</body>
</html>
